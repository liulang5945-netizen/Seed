[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seed"
version = "1.6.0"
description = "Seed product runtime for the Taiji native cognitive architecture"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "black", "ruff"]
legacy = [
    "transformers>=4.40.0,<5.0.0",
    "safetensors>=0.4.0,<1.0.0",
    "huggingface_hub>=0.20.0,<1.0.0",
    "sentencepiece>=0.2.0,<1.0.0",
    "peft>=0.8.0,<1.0.0",
    "accelerate>=0.28.0,<2.0.0",
    "psutil>=5.9.0,<7.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "websockets>=12.0,<14.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "starlette>=0.36.0,<1.0.0",
    "cryptography>=42.0.0,<47.0.0",
    "PyPDF2>=3.0.0,<4.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "langchain>=0.1.0,<1.0.0",
    "langchain-core>=0.1.0,<1.0.0",
    "langchain-community>=0.1.0,<1.0.0",
    "langchain-openai>=0.1.0,<1.0.0",
    "langchain-experimental>=0.1.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "requests>=2.31.0,<3.0.0",
    "duckduckgo-search>=5.0.0,<7.0.0",
    "sentence-transformers>=2.2.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "jieba>=0.42.0,<1.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "datasets>=2.18.0,<4.0.0",
    "tensorboard>=2.14.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
]
gpu = ["bitsandbytes>=0.43.0", "scipy>=1.10.0"]
voice = ["edge-tts", "pyttsx3", "SpeechRecognition"]
build = ["pyinstaller>=6.0.0"]

[tool.setuptools.packages.find]
include = ["seed*", "taiji*", "seed_platform*", "neuroplex*", "api*", "instruments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p",
    "no:cacheprovider",
]
markers = [
    "slow: long-running integration tests",
    "reset_state: reset app_state singleton before/after each test function",
    "benchmark: performance baseline tests (latency/throughput regression guards)",
]
norecursedirs = [
    ".git",
    ".pytest*",
    ".seed_test_tmp*",
    "pytest-cache-files-*",
    "tmp*",
    ".tmp*",
    "__pycache__",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "_libs",
    "build",
    "dist",
    "node_modules",
    ".git",
    "__pycache__",
    "scripts/archive",
    "direct-*",
    # H19b (2026-09-30): `output/` is scratch/evidence drop space, not authored
    # source -- 23 tracked files under it are README/PNG/TXT and zero are `.py`.
    # It is NOT gitignored, so a temporary `.py` probe parked here is picked up by
    # `ruff check .` and counted as real debt; that already miscounted one session.
    "output",
    # H19 (2026-09-30): `taiji-harness/` is a whole-repository fork of the upstream
    # `dsh` project (commit 82042a2f6, "G1 fork 落地"), not Seed-authored code.  It ships
    # no ruff/black configuration of its own, so our rules were being applied to 13k
    # vendored files and `ruff check .` reported 50 errors -- every single one inside the
    # fork, zero in our own tree.  Reformatting or rewriting a fork we intend to keep
    # syncing with upstream (see docs/08_UPSTREAM_SYNC_PLAYBOOK) would make every future
    # merge conflict; vendored code is excluded from our style gates, exactly as
    # `_libs` and `scripts/archive` already are.  It stays inside review, not inside
    # our formatter's reach.
    "taiji-harness",
]

[tool.ruff.lint]
# R4: I（isort）与 UP（pyupgrade）已从 advisory 转正为 blocking——
# 存量 1922 处已清零（1761 自动修 + 275 废弃导入移除 + 10 处手工），随主门禁强制执行。
# R6: B（bugbear）/ SIM（simplify）仍在 advisory（CI --select B,SIM 棘轮追踪）；
# B008 为 FastAPI Depends/File 惯用法忽略。
#
# H19（2026-09-30）本仓自有树实测基线（ruff 0.16.4，`design/ scripts/ tests/ taiji/ seed/
# seed_platform/ api/ neuroplex/ instruments/`）：**0 error**。
# 其中 6 处是真 bug 不是风格——`F821 Undefined name 'Any'/'Path'`（4 个 scripts/training 探针 +
# 1 个测试），因 `from __future__ import annotations` 让注解不求值，只在真跑到那一行才炸；
# 已补 import。这类错误 ruff 报的是"名字没定义"，读代码时极容易滑过去，故登记在此。
# B,SIM 自有树：H19 登记的「59 处未清」漏计 3 处 SIM114（H19 回退自动修复时重新
# 引入的），实测 62。H19b 用 ruff 自动修复清零 B905 全部 27 处——只追加
# strict=False（即 Python 默认值），word-diff 逐 token 验证零行为变更；余 35 处
# （B023 18 / B007 10 / SIM105 3 / SIM114 3 / SIM108 1）。H19e 再清 B007 10、SIM108 1、
# SIM114 3（带理由的 noqa），**余 21 处**（B023 18 / SIM105 3）——两者都需逐点判语义，
# 不做批量自动改。该批由 ci.yml「ratchet, baseline 21」步骤钉住，只许降不许升——
# 它不再是「advisory」，也不再是常红的裸 blocking。
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E402", "E741", "B008"]

[tool.ruff.lint.per-file-ignores]
# R6: neuroplex 冻结模块（0% 覆盖，无回归兜底）——与 [tool.mypy.overrides] 名单一致，
# 解冻时同步移除两处豁免。
"neuroplex/life/*" = ["B", "SIM"]
"neuroplex/multimodal/*" = ["B", "SIM"]
"neuroplex/safety/*" = ["B", "SIM"]
"neuroplex/loader.py" = ["B", "SIM"]
"neuroplex/tools/browser.py" = ["B", "SIM"]
"neuroplex/tools/browser_crawler.py" = ["B", "SIM"]
"neuroplex/tools/builtin_tools.py" = ["B", "SIM"]
"neuroplex/tools/desktop.py" = ["B", "SIM"]
"neuroplex/tools/mini_search.py" = ["B", "SIM"]
"neuroplex/tools/searxng.py" = ["B", "SIM"]
"neuroplex/tools/web.py" = ["B", "SIM"]
"neuroplex/tools/search/*" = ["B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]
# Workbench direct-* trees are tracked fixtures, not Python source.  They
# intentionally contain cross-language and malformed-language samples for the
# IDE/language-boundary gates, so formatting must not rewrite or parse them.
# H19 (2026-09-30): `run_taiji_unified_entry_evidence.py` is excluded for a
# *semantic* reason, not a fixture one.  `audit_taiji_b0_n2_stop_reason_disposition.py`
# freezes judgement site **J12** as the literal `"stop": "all_members_exhausted"})`
# and `test_b0_n2_stop_reason_disposition_contract.py` asserts that literal is still
# present as contiguous text.  Black reflows that call across many lines, which makes
# J12 undetectable and flips `review_checks_passed` to False — the formatter and the
# audit guard are in direct conflict.  Reformatting this file therefore requires first
# updating the frozen J12 marker; until then formatting must not touch it.
#
# The pattern MUST stay on one line as a single alternation.  `extend-exclude` is one
# regex, not a list: writing the two alternatives on separate lines makes the first
# branch require a trailing newline, so it stops matching real paths and silently
# un-excludes the fixtures.  Verified with
# `scripts/training/audit_frozen_marker_formatter_conflict.py`, which fails if this
# exclusion stops applying.
extend-exclude = "/(_libs|build|dist|node_modules|scripts/archive|taiji-harness|output|direct-[^/]+)/|/scripts/training/run_taiji_unified_entry_evidence\\.py$"

[tool.coverage.run]
source = ["seed", "taiji", "seed_platform", "neuroplex", "api"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
# R5: 覆盖率门禁 21 → 21.5；R6 再提至 21.8（实测 21.91%）：新增 SSRF 防护 +
# chat_strategies 纯函数共 15 用例。分母含大量 0% 的 neuroplex 遗留代码（~1.5万句），
# 每 +0.5% 都需上百条新覆盖语句，后续继续按轮 +0.5-1% 向 40% 基线推进。
# 注意：本阈值按「全量 tests/ + 全量 source」标定。任何只跑测试子集的 job
# 必须用 --cov=<pkg> 显式收窄度量面，否则分母掺入未触及代码会产生假低覆盖率。
# seed/taiji 核心模块已达 84-100%，seed_platform 大幅补齐，api 路由持续补齐中。
fail_under = 21.8

[tool.mypy]
# R4: 目标设为 3.12——numpy 2.x 存根使用 3.12+ 语法（type 语句），
# 低版本目标下解析即报致命 syntax 错误。
# H19d（2026-09-30）：旧版此处写的是「代码的 3.10 运行时兼容性由 CI 的 Python 3.10
# 矩阵与 ruff target-version=py310 把关」。两者已分别随 H19c（矩阵只留 3.12）与
# H19d（requires-python 提到 >=3.12、ruff/black target 同步到 py312）消失——现在
# mypy/ruff/black 三者口径一致，都是 3.12，且**不再存在任何低版本护栏**：
# 代码若误用 3.11/3.12 独有语法，mypy 不会报，只会在 3.12 runner 上正常通过。
#
# R4 建立基线，R5 消减，R6 冻结边界分治（2026-08-24，总 212 错误）：
#   seed/taiji/seed_platform/api 全部 0；neuroplex 冻结模块已移出度量面（见下），
#   剩余 212 集中在 13 个深层 torch 模块（ensemble 74 / cortex 40 / neuron 34 / stdp 28 等），
#   无测试兜底，按解冻条件逐步处理。CI 棘轮只许下降。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "_libs/",
    "build/",
    "dist/",
    "tests/",
    "scripts/",
]

# R6: neuroplex 冻结模块——覆盖率 0%，无回归兜底，盲改类型风险大于收益。
# 移出 mypy 度量面，冻结时错误数（合计 251）登记如下，解冻须先补测试再清零：
#   life/*: 106（sleep_engine 43 / integrate 18 / scheduler 15 / feed 11 / 其余 19）
#   tools 爬虫族: 79（browser 46 / mini_search 8 / search/* 10 / web 5 / 其余 10）
#   multimodal/*: 54（vqvae 18 / encodec 16 / video 16 / io 4）
#   safety/*: 7；loader: 5
[[tool.mypy.overrides]]
module = [
    "neuroplex.life.*",
    "neuroplex.multimodal.*",
    "neuroplex.safety.*",
    "neuroplex.loader",
    "neuroplex.tools.browser",
    "neuroplex.tools.browser_crawler",
    "neuroplex.tools.builtin_tools",
    "neuroplex.tools.desktop",
    "neuroplex.tools.mini_search",
    "neuroplex.tools.searxng",
    "neuroplex.tools.web",
    "neuroplex.tools.search.*",
]
ignore_errors = true
