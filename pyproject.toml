[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seed"
version = "1.6.0"
description = "Seed model built on the native Taiji predictive substrate"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "black", "ruff", "tomli>=2.0.0; python_version < '3.11'"]
legacy = [
    "transformers>=4.40.0,<5.0.0",
    "huggingface_hub>=0.20.0,<1.0.0",
    "sentencepiece>=0.2.0,<1.0.0",
    "peft>=0.8.0,<1.0.0",
    "accelerate>=0.28.0,<2.0.0",
    "psutil>=5.9.0,<7.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "websockets>=12.0,<14.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "starlette>=0.36.0,<1.0.0",
    "PyPDF2>=3.0.0,<4.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "langchain>=0.1.0,<1.0.0",
    "langchain-core>=0.1.0,<1.0.0",
    "langchain-community>=0.1.0,<1.0.0",
    "langchain-openai>=0.1.0,<1.0.0",
    "langchain-experimental>=0.1.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "requests>=2.31.0,<3.0.0",
    "duckduckgo-search>=5.0.0,<7.0.0",
    "sentence-transformers>=2.2.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "jieba>=0.42.0,<1.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "datasets>=4.0.0,<5.0.0",
    "tensorboard>=2.14.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
]
gpu = ["bitsandbytes>=0.43.0", "scipy>=1.10.0"]
voice = ["edge-tts", "pyttsx3", "SpeechRecognition"]
desktop = ["PyQt6>=6.5.0", "PyQt6-WebEngine>=6.5.0"]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
seed-legacy-desktop = "desktop.main:main"

[tool.setuptools.packages.find]
include = ["seed*", "taiji*", "neuroplex*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p",
    "no:cacheprovider",
]
markers = [
    "slow: long-running integration tests",
    "reset_state: reset app_state singleton before/after each test function",
    "benchmark: performance baseline tests (latency/throughput regression guards)",
]
cache_dir = ".seed_test_tmp/pytest_cache"
norecursedirs = [
    ".git",
    ".pytest*",
    ".seed_test_tmp*",
    "pytest-cache-files-*",
    "tmp*",
    ".tmp*",
    "__pycache__",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "_libs",
    "build",
    "dist",
    "node_modules",
    ".git",
    "__pycache__",
    "scripts/archive",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E741"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/(_libs|build|dist|node_modules|scripts/archive)/"

[tool.coverage.run]
source = ["seed", "taiji", "neuroplex", "api"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
# F02: 覆盖率门禁——当前基线约 19%，设为 17% 防止退化；随覆盖率提升逐步上调。
# seed/taiji 核心模块已达 75-100%，neuroplex/tools 与 api 路由待补齐。
fail_under = 17

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "_libs/",
    "build/",
    "dist/",
    "tests/",
    "scripts/",
]
