# rev 必须是上游真实存在的 git tag，且与 .github/workflows/ci.yml 的 pip pin 保持一致。
# 教训：曾把 black 钉在 24.12.0——PyPI 与 psf/black 的 tag 列表里都没有这个版本
# （24.10.0 之后直接跳到 25.1.0），CI 装依赖即失败，本地钩子同样装不上。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      # 2026-10-22（项目审查 P0-3）：本地 B/SIM 棘轮口径，与 ci.yml「ratchet, baseline 0」
      # 步同源。**刻意不带 --fix**：B023（闭包晚绑定）是唯一真 bug 类、必须逐点判语义；
      # SIM114 合并同臂曾被裁定为"掩盖不同失败原因"（H19e 以带理由 noqa 处置）。
      # 守卫只许红，不许静默改写。
      - id: ruff
        name: ruff (B/SIM ratchet, baseline 0)
        args: [--select, B,SIM, --ignore, B008]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
