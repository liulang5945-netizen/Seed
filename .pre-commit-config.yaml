# rev 必须是上游真实存在的 git tag，且与 .github/workflows/ci.yml 的 pip pin 保持一致。
# 教训：曾把 black 钉在 24.12.0——PyPI 与 psf/black 的 tag 列表里都没有这个版本
# （24.10.0 之后直接跳到 25.1.0），CI 装依赖即失败，本地钩子同样装不上。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      # 2026-10-22（项目审查 P0-3）：本地 B/SIM 棘轮口径，与 ci.yml「ratchet, baseline 0」
      # 步同源。**刻意不带 --fix**：B023（闭包晚绑定）是唯一真 bug 类、必须逐点判语义；
      # SIM114 合并同臂曾被裁定为"掩盖不同失败原因"（H19e 以带理由 noqa 处置）。
      # 守卫只许红，不许静默改写。
      - id: ruff
        name: ruff (B/SIM ratchet, baseline 0)
        args: [--select, B,SIM, --ignore, B008]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # 2026-11-11：计划文档链到"本机有、仓库没有"的文件，已经两次进 main 才被事后测试
  # 抓到（`03_CURRENT_EXECUTION.md` 一次；`taiji_scale_20261108_outputs.jsonl` 这次，
  # 报错要等 1 小时全量回归）。同一类错误不能靠"下次注意"，所以把它挪到提交路径上：
  # `plans/active` 的每条相对链接必须解析到**已入库**文件；全 `plans` 树禁止 `.jsonl`
  # 链接（.gitignore 排除所有 `*.jsonl`，这种链接在别人机器上永远 404）。
  # 判据与 `tests/seed/test_project_identity.py` 的契约一致，只是提前到提交时。
  - repo: local
    hooks:
      - id: doc-evidence-links
        name: doc evidence links (plans)
        entry: python scripts/ci/check_doc_links.py
        language: system
        files: ^plans/.*\.md$
        pass_filenames: false
