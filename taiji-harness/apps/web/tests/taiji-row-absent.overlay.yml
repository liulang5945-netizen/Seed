# Withdraw the Taiji provider completely: disabling the row leaves neither a routable
# adapter nor a settings-directory entry for `taiji-local`. The keyless first-run lanes
# own a "no usable route" premise, so they must not inherit it from whatever runtime
# happens to answer on the host.
# The shipped default now rides the Taiji route (G5-D3, owner-approved 2026-09-27);
# with the row withdrawn that would leave these DeepSeek-premise lanes on a route
# nothing serves, so pin the default back onto DeepSeek for exactly this premise.
- id: llm-taiji
  disabled: true
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
