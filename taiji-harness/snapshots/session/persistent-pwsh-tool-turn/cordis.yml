# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@taiji/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@taiji/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@taiji/dsh-subprocess-local'

- insert:
    - id: terminal
      name: '@taiji/dsh-terminal'

- insert:
    - id: terminal-pwsh
      name: '@taiji/dsh-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@taiji/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@taiji/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@taiji/dsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@taiji/dsh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@taiji/dsh-tool-jobs'
  disabled: true

- id: goal
  name: '@taiji/dsh-goal'
  disabled: true

- id: goal-round-driver
  name: '@taiji/dsh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@taiji/dsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@taiji/dsh-tool-goal'
  disabled: true

- id: skill
  name: '@taiji/dsh-skill'
  disabled: true

- id: skill-filesystem
  name: '@taiji/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@taiji/dsh-tool-skill'
  disabled: true

- id: tool-bash
  name: '@taiji/dsh-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@taiji/dsh-tool-pwsh-persistent'
