<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="冯·诺依曼架构示意图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <linearGradient id="cpuFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0edff"/>
      <stop offset="100%" stop-color="#c7dcff"/>
    </linearGradient>
    <linearGradient id="memFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6fbf0"/>
      <stop offset="100%" stop-color="#c8f0dd"/>
    </linearGradient>
    <linearGradient id="ioFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3dc"/>
      <stop offset="100%" stop-color="#ffe4b8"/>
    </linearGradient>
    <style>
      .box   { stroke-width: 2; rx: 10; }
      .title { font: 700 17px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .sub   { font: 600 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .lbl   { font: 400 12.5px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .cap   { font: 700 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .note  { font: 400 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .flow  { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow2 { stroke: #334155; stroke-width: 2; fill: none;
               marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="30" y="38" class="cap">冯·诺依曼架构（Von Neumann Architecture）</text>

  <!-- CPU -->
  <rect x="180" y="70" width="400" height="150" class="box"
        fill="url(#cpuFill)" stroke="#3b7ddd"/>
  <text x="380" y="96" text-anchor="middle" class="title">CPU 中央处理器</text>

  <rect x="210" y="112" width="150" height="86" rx="8" fill="#ffffff" stroke="#7ea9e8"/>
  <text x="285" y="145" text-anchor="middle" class="sub">控制单元</text>
  <text x="285" y="166" text-anchor="middle" class="lbl">Control Unit</text>
  <text x="285" y="184" text-anchor="middle" class="lbl">取指 / 译码 / 发令</text>

  <rect x="400" y="112" width="150" height="86" rx="8" fill="#ffffff" stroke="#7ea9e8"/>
  <text x="475" y="145" text-anchor="middle" class="sub">算术逻辑单元</text>
  <text x="475" y="166" text-anchor="middle" class="lbl">ALU</text>
  <text x="475" y="184" text-anchor="middle" class="lbl">运算 / 逻辑</text>

  <!-- Bus -->
  <rect x="60" y="300" width="640" height="52" rx="8"
        fill="#eef2f7" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="380" y="326" text-anchor="middle" class="sub">系统总线</text>
  <text x="380" y="344" text-anchor="middle" class="lbl">数据总线 · 地址总线 · 控制总线</text>

  <!-- Memory -->
  <rect x="60" y="396" width="280" height="96" class="box"
        fill="url(#memFill)" stroke="#2f9e6e"/>
  <text x="200" y="426" text-anchor="middle" class="sub">存储器 Memory</text>
  <text x="200" y="450" text-anchor="middle" class="lbl">存放指令与数据</text>
  <text x="200" y="470" text-anchor="middle" class="lbl">统一编址 · 冯·诺依曼瓶颈</text>

  <!-- I/O -->
  <rect x="420" y="396" width="280" height="96" class="box"
        fill="url(#ioFill)" stroke="#d99426"/>
  <text x="560" y="426" text-anchor="middle" class="sub">输入 / 输出设备</text>
  <text x="560" y="450" text-anchor="middle" class="lbl">Input / Output</text>
  <text x="560" y="470" text-anchor="middle" class="lbl">键盘 · 显示 · 磁盘 · 网络</text>

  <!-- Connections -->
  <path class="flow" d="M 330 220 L 330 300"/>
  <path class="flow" d="M 430 220 L 430 300"/>
  <path class="flow2" d="M 200 352 L 200 396"/>
  <path class="flow2" d="M 560 352 L 560 396"/>

  <text x="345" y="265" class="note">指令 / 数据</text>
  <text x="30" y="378" class="note">读 / 写</text>
  <text x="640" y="378" class="note">读 / 写</text>

  <text x="30" y="508" class="note">要点：程序与数据同存于存储器，CPU 按地址顺序取指执行 —— 即“存储程序”原理。</text>
</svg>
