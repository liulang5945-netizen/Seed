        --deselect tests/taiji_native/test_native_reader_transfer_contract.py::test_refuse_nontrain_before_updates
        --deselect tests/taiji_native/test_n1_plan157_seed128_candidate_vs_parent_diagnostic_contract.py::test_partial_face_continuation_reuses_exactly_the_sealed_endpoint
        --deselect tests/taiji_native/test_n1_plan160_seed130_candidate_parent_diagnostic_contract.py::test_seed128_and_seed129_values_are_in_seed130_exclusion_sets
        --deselect tests/taiji_native/test_n1_plan161_seed131_question_surface_diagnostic_contract.py::test_question_templates_are_absent_from_bound_training_questions
        --deselect tests/taiji_native/test_r2_copy_surface_extension_v2_contract.py::test_manifest_is_reproducible_from_the_generator
        --deselect tests/taiji_native/test_r2_dialogue_continuation_extension_runner_contract.py::test_start_charge_uses_latest_extension_snapshot_monotonically
        --deselect tests/taiji_native/test_r2_dialogue_continuation_source_validation_contract.py::test_frozen_base_validator_reproduces_reviewed_builder_sha_rejection
        --deselect tests/taiji_native/test_seal_ast_hash_invariants.py::test_green_channel_real_file_and_git_attestation
    steps:
      # Frozen hashes describe the committed LF bytes; Windows checkout must not
      # convert plans/manifests/source to CRLF before their contracts run.
      - name: Preserve committed bytes on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        # H19w (2026-09-30): full history, not the default depth=1.
        # tests/taiji_native/test_copy_circuit_contract.py runs
        # `git show 72d81faf^:scripts/training/probe_taiji_a30_stop_failure...`, which a shallow
        # checkout cannot resolve -- it failed with
        # `CalledProcessError: ['git', 'show', '72d81faf^:...']` while passing locally, where the
        # history is complete.  The checkout steps in docker-build / startup-smoke are left
        # shallow: nothing there reads history.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU)
        run: pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        # H19s (2026-09-30): black is required here, not optional.  The frozen-marker
        # contract test imports scripts/training/audit_frozen_marker_formatter_conflict.py,
        # which imports black; without it this leg died with
        # `ModuleNotFoundError: No module named 'black'` during collection.  Pinned to match
        # the lint job so both legs agree on formatter behaviour.  Skipping the test was the
        # alternative and the worse one: line-ending handling is exactly where a frozen
        # marker breaks, so this is the leg that should run it.
        # H19x (2026-10-21): the Windows full-suite leg uses `pip install -e . --no-deps`,
        # but collected N1 training runners import psutil directly. Without an explicit
        # install, 141 test modules failed collection with ModuleNotFoundError: psutil.
        run: pip install sentencepiece pytest pytest-cov httpx fastapi python-multipart pydantic anyio cryptography numpy "psutil>=5.9.0,<7.0.0" black==26.5.1

      - name: Install package (editable)
        run: pip install -e . --no-deps

      # F06-R3: Windows 核心测试 + 顶层回归 + 覆盖率 + JUnit 报告，便于跨平台对比
      # 覆盖率度量面必须与测试范围对齐：本 job 跑全量 tests/（排除 slow），
      # 与 Ubuntu test job 保持一致范围，便于跨平台对比。
      - name: Run full regression tests on Windows
        # ${{ env.DSH_CI_DESELECT }} **必须带**：本步跑整个 tests/，
        # 不带则族 B/C 那 5 条会在这里再红一次（㊵-467 实测：run 37505960489 红 5 条）。
        run: >-
          python -m pytest tests/ -q -m "not slow" --cov
          --junitxml=report-win.xml
          --cov-report=xml:coverage-win.xml
          ${{ env.DSH_CI_DESELECT }}

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            report-win.xml
            coverage-win.xml
