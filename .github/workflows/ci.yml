        --deselect tests/taiji_native/test_n4_05_product_default_mount_contract.py::test_mounting_an_empty_store_is_a_latent_effect_not_a_behaviour_change
        --deselect tests/taiji_native/test_n5_17_j_n5b_5_retention_lane_contract.py::test_same_basename_different_bytes_is_not_same_source
