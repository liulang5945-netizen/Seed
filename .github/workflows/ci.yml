name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Seed/Taiji only require torch. sentencepiece/FastAPI are installed
      # below solely so the frozen Legacy NeuroPlex regressions remain runnable.
      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        # FastAPI 可选依赖：python-multipart（form/File）—— test_api_health 触发 Form 中间件
        # 另带 pydantic+anyio（FastAPI 内部用）确保类型解析工作正常
        # tomli 仅 3.10 需要：tomllib 自 3.11 才进标准库，环境标记让 3.12 自动跳过
        # cryptography：SecureStorage 的 Fernet 加密后端，缺失会让 AuthManager 构造失败 → 中间件 503
        # F08: 锁定 ruff/black 版本与 .pre-commit-config.yaml 一致，避免本地/CI lint 结果不一致
        run: pip install sentencepiece pytest pytest-cov httpx fastapi python-multipart pydantic anyio cryptography ruff==0.9.0 black==24.12.0 mypy pip-audit "tomli>=2.0.0; python_version < '3.11'"

      - name: Install package (editable)
        run: pip install -e . --no-deps

      - name: Check version consistency
        run: python scripts/sync_version.py --check

      # R4: ruff 主门禁已包含 I（isort）+ UP（pyupgrade）——存量 1922 处已清零，
      # advisory 步骤已转正移除，新违规直接阻断。
      - name: Lint with ruff
        run: ruff check .

      # R6: B（bugbear）/ SIM（simplify）已转正为 blocking——存量 202 → 32（<50），
      # B008 为 FastAPI Depends/File 惯用法显式忽略，冻结模块经 pyproject
      # per-file-ignores 排除（名单与 mypy overrides 一致，解冻时同步移除）。
      - name: Lint with ruff bugbear/simplify rules (blocking)
        run: ruff check . --select B,SIM --ignore B008

      - name: Format check with black
        run: black --check .

      # R4: mypy 双层门禁（原 advisory 已转正）
      # 1) 核心模块 seed/taiji：blocking，0 错误。follow-imports=silent
      #    隔离遗留模块的错误上报，只对核心代码自身错误阻断。
      - name: Type check core modules with mypy (blocking)
        run: mypy --follow-imports=silent seed taiji

      # 2) 全仓债务棘轮：总错误数不得超过基线 212（全部为 neuroplex 深层
      #    torch 模块遗留；R6 将 0% 覆盖冻结模块移出度量面（251 错）并对其余模块
      #    实修消减至 212，基线更新 2026-08-24）。只允许下降，回升即阻断。
      - name: Track mypy legacy debt (ratchet, baseline 212)
        run: |
          errors=$(mypy seed taiji neuroplex api | tail -n1 | grep -oE '[0-9]+' | head -n1)
          echo "mypy total errors: $errors (baseline 212, must not increase)"
          test -n "$errors" && test "$errors" -le 212

      # F10-R3: 依赖 CVE 扫描（advisory 模式）
      # 转正计划：发现 HIGH/CRITICAL CVE 时立即修复；连续 2 次 CI 无高危后改 blocking。
      # R6 评估：仍存在中高危（aiohttp 3.14.2→3.14.3、datasets 5.0.0→5.0.1 为传递依赖，
      #   pip/setuptools 为 CI 工具链），未达「连续无高危」条件，维持 advisory；
      #   传递依赖修复列入 R7（避免升级扰动大型遗留栈）。
      - name: Audit dependencies for known CVEs (advisory → blocking when 0 HIGH)
        run: pip-audit --desc
        continue-on-error: true

      # F11: 每个 verify 脚本统一输出 VERIFY_RESULT 行（{name, status, metrics, checks}），
      # 并将完整报告写入 reports/ci_verify/，最后作为 artifact 归档以便趋势分析。
      - name: Verify native Taiji end to end
        run: python -X utf8 -u scripts/training/verify_taiji_native_v7.py --output reports/ci_verify/taiji_native_v7.json

      - name: Verify second-order context causality
        run: python -X utf8 -u scripts/training/verify_taiji_n7_context.py --output reports/ci_verify/taiji_n7_context.json

      - name: Verify delayed trace causality
        run: python -X utf8 -u scripts/training/verify_taiji_n8_delayed_trace.py --output reports/ci_verify/taiji_n8_delayed_trace.json

      - name: Verify long free-running stability
        run: python -X utf8 -u scripts/training/verify_taiji_n9_long_free_run.py --output reports/ci_verify/taiji_n9_long_free_run.json

      - name: Verify sparse-kernel migration
        run: python -X utf8 -u scripts/training/verify_taiji_n10_sparse_migration.py --output reports/ci_verify/taiji_n10_sparse_migration.json

      - name: Verify active environment learning
        run: python -X utf8 -u scripts/training/verify_taiji_n11_active_environment.py --output reports/ci_verify/taiji_n11_active_environment.json

      - name: Verify native episodic field
        run: python -X utf8 -u scripts/training/verify_taiji_m5_episodic_field.py --output reports/ci_verify/taiji_m5_episodic_field.json

      - name: Verify endogenous replay consolidation
        run: python -X utf8 -u scripts/training/verify_taiji_m6_endogenous_replay.py --output reports/ci_verify/taiji_m6_endogenous_replay.json

      - name: Upload verify reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports-${{ matrix.python-version }}
          path: reports/ci_verify/

      - name: Run native architecture contracts
        run: python -m pytest tests/taiji_native -q

      - name: Run Seed model-boundary contracts
        run: python -m pytest tests/seed -q

      - name: Run complete regression suite
        # Legacy real-checkpoint tests skip when local artifacts are absent.
        run: python -m pytest tests/ -q --cov --junitxml=report.xml --cov-report=xml:coverage.xml

      # R4: 覆盖率趋势可见性——把总覆盖率写入 job summary，跨运行可对比；
      # 硬门禁仍由 pyproject.toml fail_under（当前 21%）执行，只升不降。
      - name: Coverage trend summary
        if: always()
        run: |
          total=$(python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
              print(f"{float(root.get('line-rate', 0)) * 100:.2f}")
          except Exception:
              print("unavailable")
          PY
          )
          echo "### Coverage trend" >> "$GITHUB_STEP_SUMMARY"
          echo "Total line coverage: **${total}%** (gate: fail_under=21.8%)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # F01: ESLint blocking 门禁——错误会阻断合并，警告暂不阻断（当前 0 errors / ~210 warnings）
      - name: Lint frontend
        working-directory: frontend
        run: npx eslint src --ext .js,.vue

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f frontend/dist/index.html || (echo "dist/index.html missing" && exit 1)
          echo "Frontend build OK"

      # F04-R3: 前端依赖 CVE 扫描——与后端 pip-audit 对等
      - name: Audit frontend dependencies for known CVEs
        working-directory: frontend
        run: npm audit --production --audit-level=high

      # F02-R3: Playwright E2E 冒烟测试——build 后启动 preview 服务器运行 E2E
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        env:
          SEED_E2E_BASE_URL: http://localhost:4173
        working-directory: frontend
        run: |
          npx vite preview --port 4173 &
          sleep 3
          node e2e/smoke.cjs

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # R4: 用 compose 构建（同时验证 docker-compose.yml 可解析），镜像标签 seed:latest
      - name: Build image via docker compose
        run: docker compose build

      - name: Verify Docker image metadata
        run: |
          docker inspect seed:latest --format='{{.Config.ExposedPorts}}' | grep -q '8000' && echo "Port 8000 exposed: OK"
          docker inspect seed:latest --format='{{.Config.Healthcheck}}' | grep -q 'health' && echo "Healthcheck configured: OK"

      # R4: 启动冒烟——compose up 后轮询 /api/health 直到可用，
      # 再确认容器自身 HEALTHCHECK 进入 healthy，验证健康检查接线真实有效。
      - name: Startup smoke and healthcheck
        run: |
          docker compose up -d
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "Health endpoint OK after $((i * 2))s"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "Health endpoint never became ready"
            docker compose logs
            exit 1
          fi
          healthy=0
          for i in $(seq 1 30); do
            status=$(docker inspect seed-api --format='{{.State.Health.Status}}' || echo unknown)
            if [ "$status" = "healthy" ]; then
              echo "Container HEALTHCHECK reports healthy"
              healthy=1
              break
            fi
            sleep 4
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Container never reached healthy status"
            docker inspect seed-api --format='{{json .State.Health}}'
            exit 1
          fi

      - name: Compose cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  startup-smoke:
    name: Startup smoke (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: no-legacy
            install-legacy: false
            test-name: test_api_starts_without_legacy_imports
            enable-legacy: "0"
          - profile: legacy
            install-legacy: true
            test-name: test_api_starts_with_legacy_enabled
            enable-legacy: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test runner
        run: pip install pytest

      - name: Install platform dependencies without Legacy extra
        if: matrix.install-legacy == false
        run: |
          pip install fastapi python-multipart pydantic anyio cryptography
          pip install -e . --no-deps

      - name: Install package with Legacy extra
        if: matrix.install-legacy == true
        run: pip install -e ".[legacy]"

      - name: Run selected startup smoke
        env:
          SEED_ENABLE_LEGACY: ${{ matrix.enable-legacy }}
        run: python -m pytest tests/seed/test_no_legacy_startup_smoke.py -q -k "${{ matrix.test-name }}"

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install sentencepiece pytest pytest-cov httpx fastapi python-multipart pydantic anyio cryptography "tomli>=2.0.0; python_version < '3.11'"

      - name: Install package (editable)
        run: pip install -e . --no-deps

      # F06-R3: Windows 核心测试 + 顶层回归 + 覆盖率 + JUnit 报告，便于跨平台对比
      # 覆盖率度量面必须与测试范围对齐：本 job 跑全量 tests/（排除 slow），
      # 与 Ubuntu test job 保持一致范围，便于跨平台对比。
      - name: Run full regression tests on Windows
        run: python -m pytest tests/ -q -m "not slow" --cov --junitxml=report-win.xml --cov-report=xml:coverage-win.xml

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            report-win.xml
            coverage-win.xml

      # F05: 桌面构建配置轻量验证——编译检查 seed.spec / build.py / release.py，
      # 及时发现语法或导入破坏，避免本地打包时才暴露（完整 PyInstaller 构建较重，不入 PR 门禁）
      - name: Validate desktop build configuration
        run: |
          python -c "import py_compile; py_compile.compile('desktop/build.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('scripts/release.py', doraise=True)"
          python -c "import ast; ast.parse(open('desktop/seed.spec', encoding='utf-8').read()); print('seed.spec: syntax OK')"
