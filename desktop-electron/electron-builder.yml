# Electron 打包配置 —— 替代 desktop/seed.spec(PyInstaller 双入口) + desktop/installer.nsi(NSIS 脚本)。
#
# 双轨期声明：本配置**不启用**为出货路径。PyQt6 侧仍由 scripts/release.py 走
# 前端构建 -> PyInstaller -> 后处理 -> NSIS 五步流程出 SeedSetup.exe。
# 待 Electron 侧通过双轨验证后，再由 scripts/release.py 增一条分支接管。

appId: Seed.Desktop.Shell
productName: Seed
copyright: Seed

# 直接用 node_modules 里已解压好的 Electron 发行版，而不是让 electron-builder 自己解压。
#
# 实测（2026-09-21）：不设此项时构建稳定卡死在
#   • no custom electronDist provided, unpacking default Electron distribution
# 之后 —— release/ 全空、无任何子进程、CPU 近零，等 8 分钟无进展（换镜像/不走镜像都试过，
# 两种配置卡在不同位置）。缓存的 electron-v44.4.3-win32-x64.zip 本身经校验完整
# （158.2 MB / 73 条目 / zip integrity OK），且手工 sha256 校验过的三个工具链 7z
# 补进缓存后仍卡在同一处，故排除网络与资产损坏。
#
# 代价与前提：要求 electron 的 dist 已存在，即 `npm install` 的 postinstall 成功下载过。
# 本机首次 install 时该下载被静默跳过，补下方式见简报 §9.5.4。版本仍由 package.json
# 精确钉死（electron 44.4.3），因此这里不会引入版本漂移。
electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: build

# 只打编译产物，不打源码（源码以 TS 形式保留在 src/）
files:
  - dist/**/*
  - package.json

# 前端资源不打进来：它由 Python 后端自己托管（api/app.py::_mount_static_assets 挂
# frontend/dist + SPA catch-all），所以随 SeedBackend.exe 的打包布局走，不在这里重复一份。
# 同理 seed.spec 里那份「源码 dist 与内置 dist 必须一致」的校验，在 Electron 侧不需要。

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Seed
  artifactName: SeedSetup-${version}-electron.exe
